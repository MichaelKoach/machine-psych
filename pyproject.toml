[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-psych"
version = "0.1.0"
description = "A harness for qualitative behavioural research on language models"
requires-python = ">=3.10"
dependencies = ["requests", "pandas"]

[project.urls]
Homepage = "https://github.com/MichaelKoach/machine-psych"

[tool.setuptools.packages.find]
include = ["machine_psych*"]
